name: Deploy Worker

# Replaces the Workers Builds Git integration, which cannot build this Worker:
# its build image is Node-based and its default commands (`npm run build`,
# `npx wrangler deploy`) never vendor Flask into python_modules/. That folder is
# gitignored, so a fresh checkout never has it - and a bare `wrangler deploy`
# uploads the Worker without Flask in it.
#
# The Python toolchain has to run, and pywrangler is what runs it:
# `pywrangler deploy` syncs the Pyodide builds of the pyproject.toml
# dependencies and then hands off to wrangler.
#
# Once this workflow is green, disconnect the dashboard integration so the
# failing "Workers Builds: systematic-bm" check goes away:
#   Workers & Pages > systematics-bm > Settings > Builds > Disconnect

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A newer push supersedes a queued one, but never
# interrupts an upload that is already running.
concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: uv run pywrangler deploy
    runs-on: ubuntu-latest
    env:
      # Read by wrangler. Add both under Settings > Secrets and variables >
      # Actions > New repository secret:
      #   CLOUDFLARE_API_TOKEN   - the "Edit Cloudflare Workers" template is enough
      #   CLOUDFLARE_ACCOUNT_ID  - dashboard sidebar, or `npx wrangler whoami`
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      # Pinned to a full version, not a floating major tag: setup-uv does not
      # publish `v10`, so `@v10` fails to resolve and the job dies during
      # "Set up job" with no step log to explain it.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # pywrangler shells out to `npx wrangler`, so Node and node_modules come
      # with it. The lockfile pins the wrangler version the project was checked
      # against. Node 22 is a floor, not a preference: wrangler 4.132 refuses to
      # start on Node 20 with "Wrangler requires at least Node.js v22.0.0".
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install the Python toolchain and local wrangler
        run: |
          uv sync --group dev
          npm ci

      - name: Fail early if the Cloudflare credentials are missing
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."
            exit 1
          fi

      # Cheap guard so a syntax error is reported as itself instead of as a
      # deploy failure. compileall only parses, it never runs the module.
      - name: Byte-compile the Worker sources
        run: uv run python -m compileall -q src

      # Prints the token's own view of itself, because a failed deploy says only
      # "exit code 1". Deliberately non-fatal: `wrangler whoami` exits non-zero
      # for a correct account-scoped token (enumerating memberships is a
      # user-level permission such a token does not have), so letting it gate the
      # deploy would hide the real failure behind a diagnostic.
      - name: Show what the API token is allowed to do
        continue-on-error: true
        run: |
          echo "--- token status:"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify
          echo
          echo "--- accounts and permissions this token can see:"
          npx wrangler whoami

      # wrangler.jsonc declares secrets.required, so this also refuses to run
      # until SESSION_SECRET and ADMIN_PASSWORD exist on the Worker. Set them
      # once with `npx wrangler secret put <NAME>`.
      - name: Deploy
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/deploy.log"
          if uv run pywrangler deploy 2>&1 | tee "$log"; then
            exit 0
          fi

          # Repeat the tail of the failure as an annotation. A step log has to be
          # fetched with a token, but annotations are readable from the Checks API
          # and appear on the commit, so the reason for a failure stays visible to
          # anyone who can see the check.
          # Join the lines first, then escape: `sed -e s/%/%25/g` only touches the
          # line in hand, so escaping before the N loop would miss every line after
          # the first. Percent must be escaped before newlines become %0A.
          tail -n 25 "$log" \
            | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r//g' -e 's/\n/%0A/g' \
            > "$RUNNER_TEMP/tail.txt"
          echo "::error::$(cat "$RUNNER_TEMP/tail.txt")"
          exit 1
