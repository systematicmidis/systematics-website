{% extends "base.html" %}
{% block title %}Sign in · Systematics Black Midi site{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Sign in</h1>
  <form method="post">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label>Username<input name="username" required autofocus></label>
    <label>Password<input type="password" name="password" required></label>
    <button type="submit">Sign in</button>
  </form>
  <p class="auth-bottom">Don't have an account? <a href="{{ url_for('register') }}">Create one</a>.</p>
</div>
{% endblock %}
