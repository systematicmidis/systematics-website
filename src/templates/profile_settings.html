{% extends "base.html" %}
{% block title %}Edit profile · Systematics Black Midi site{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Edit profile</h1>
  <p class="muted">Your username and user ID cannot be changed.</p>
  <form method="post" enctype="multipart/form-data">
    <label>Username<input value="{{ user.username }}" disabled></label>
    <label>User ID<input value="{{ user.user_id }}" disabled></label>
    <label>Display name<input name="display_name" maxlength="40" value="{{ user.display_name }}" required></label>
    <label>New profile picture
      <input type="file" name="profile_picture" accept="image/png,image/jpeg,image/gif,image/webp">
    </label>
    <button type="submit">Save changes</button>
  </form>
</div>
{% endblock %}
