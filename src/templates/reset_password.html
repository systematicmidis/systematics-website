{% extends "base.html" %}
{% block title %}Choose a new password · Systematics Black Midi site{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Choose a new password</h1>
  <p class="muted">Picking a new one signs you out on every other device.</p>
  <form method="post">
    <label>New password
      <input type="password" name="password" minlength="8"
             autocomplete="new-password" required autofocus>
      <small>At least 8 characters.</small>
    </label>
    <label>Confirm new password
      <input type="password" name="confirm_password" minlength="8"
             autocomplete="new-password" required>
    </label>
    <button type="submit">Change my password</button>
  </form>
  <p class="auth-bottom"><a href="{{ url_for('login') }}">Back to sign in</a></p>
</div>
{% endblock %}
