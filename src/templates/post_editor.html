{% extends "base.html" %}
{% block title %}{% if post %}Edit{% else %}New{% endif %} Post{% endblock %}
{% block content %}
<div class="editor">
  <p class="eyebrow">CONTENT EDITOR</p>
  <h1>{% if post %}Edit post{% else %}Create a post{% endif %}</h1>
  <form method="post">
    <label>Title
      <input name="title" value="{{ post.title if post else '' }}" required>
    </label>
    {% if post %}
      <p class="muted">Live at <code>/post/{{ post.id }}</code></p>
    {% endif %}
    <label>Status
      <select name="status">
        <option value="published" {% if not post or post.status == 'published' %}selected{% endif %}>Published</option>
        <option value="draft" {% if post and post.status == 'draft' %}selected{% endif %}>Draft</option>
      </select>
    </label>
    <label>Content
      <textarea name="content" rows="16" required>{{ post.content if post else '' }}</textarea>
    </label>
    <div class="actions">
      <button type="submit">{% if post %}Save changes{% else %}Publish post{% endif %}</button>
      <a href="{{ url_for('admin') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
